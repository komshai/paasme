<!DOCTYPE html>
<html lang="gu">
  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body>
    <header class="site-header">
      <div class="container nav-wrap">

    <main>

          <input id="email" type="email" placeholder="ઈમેલ દાખલ કરો" required />
          <input id="password" type="password" placeholder="પાસવર્ડ" required />
          <div class="auth-actions">
            <button class="btn btn-primary" type="submit">લોગિન</button>
          </div>

        <div class="note-box">
          <p>નવું વપરાશકર્તા? <a href="booking.html">બુકિંગ સાઇટ પર જાઓ</a></p>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
